x-backend-env: &backend_env
  DATABASE_URL: postgresql://meditrack:${POSTGRES_PASSWORD}@postgres:5432/meditrack
  REDIS_URL: redis://redis:6379
  NATIONAL_ID_SECRET: ${NATIONAL_ID_SECRET:?Run npm run env:init}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meditrack
      POSTGRES_USER: meditrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run env:init}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - clinic_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meditrack -d meditrack"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    profiles: [app]
    build: .
    command: ["node", "dist/migrate.js"]
    environment:
      <<: *backend_env
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    depends_on:
      postgres: {condition: service_healthy}
  api:
    profiles: [app]
    build: .
    environment: *backend_env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  web:
    profiles: [app]
    build: ${FRONTEND_DIR:-../meditrack-frontend}
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]

volumes:
  clinic_data: {}
